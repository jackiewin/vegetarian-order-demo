, 0, "班次可能變動，應核對官方最新資訊。"], ["醫院掛號完成後應保留什麼？", ["掛號日期、科別、序號與報到資訊", "陌生連結", "別人的病歷"], 0, "就醫前確認掛號明細與報到規則。"], ["電子票券使用前，應該先看什麼？", ["日期、場次與入場規則", "分享次數", "圖片顏色"], 0, "電子票可能限制使用場次及退換條件。"], ["手機購物優惠券最重要的資訊是？", ["使用期限與適用條件", "廣告字體", "朋友按讚數"], 0, "要確認門市、期限與最低消費等限制。"], ["如何避免房間訂錯日期？", ["下單前再次核對入住和退房日期", "只看房間照片", "忽略確認信"], 0, "訂房日期與晚數會影響總價和可入住時間。"], ["飯店標示不可退款，通常代表什麼？", ["取消後可能無法退回款項", "一定能免費退訂", "訂房不用付款"], 0, "應在付款前確認取消政策。"], ["手機不見了，可以先用什麼功能？", ["尋找裝置", "重新買手機就不必處理", "公開帳密"], 0, "裝置尋找功能可協助定位或啟用遺失處理。"], ["手機緊急聯絡資料應如何設定？", ["由本人確認後填寫可信聯絡人", "全部公開社群", "放一組假號碼"], 0, "緊急資料須正確且注意隱私。"], ["學習緊急SOS時，哪一做法正確？", ["看示範，不實際呼叫救援", "直接撥119測試", "每天測試一次"], 0, "練習不應占用救援資源。"], ["收到LINE「銀行帳戶凍結」連結時，最好怎麼做？", ["自行開啟銀行官方APP查證", "立即輸入驗證碼", "把網銀密碼傳給朋友"], 0, "不要由陌生連結提交密碼和驗證碼。"], ["如何利用手機備忘錄幫助生活？", ["設定待辦事項與提醒", "儲存所有帳號密碼並公開", "只拿來看廣告"], 0, "可建立購物與活動清單，搭配提醒使用。"], ["Google日曆可幫忙什麼？", ["設定回診與活動提醒", "直接替代醫師診斷", "自動保證不遲到"], 0, "行事曆能協助安排時間，仍需自行查看通知。"], ["請AI安排旅遊行程後，應如何做？", ["核對景點營業時間及交通資訊", "全部視為官方保證", "不用確認票價"], 0, "AI可能提供過時資訊，關鍵資料應查官方來源。"], ["看到朋友傳的「免費領補助」訊息，怎麼做較安全？", ["向政府官方來源查核", "先付手續費", "轉傳給所有人"], 0, "政府福利資格與申請方式需經官方確認。"]];let index=0,selected={},visible=new Set();function render(){el('counter').textContent='第'+(index+1)+'題／'+questions.length;let q=questions[index];el('question').textContent=q[0];el('opts').innerHTML=q[1].map((o,i)=>'<button class="option '+(selected[index]===i?'sel':'')+'" onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+safe(o)+'</button>').join('');el('answer').textContent='✅ 正確答案：'+String.fromCharCode(65+q[2])+'．'+q[1][q[2]]+'\n解析：'+q[3]+(selected[index]===undefined?'':'\n你的選擇：'+(selected[index]===q[2]?'答對':'再複習'));display('answer',visible.has(index))}function choose(i){selected[index]=i;render()}function reveal(){visible.has(index)?visible.delete(index):visible.add(index);render()}function prev(){index=Math.max(index-1,0);render();scrollTo(0,0)}function next(){index=(index+1)%questions.length;render();scrollTo(0,0)}function toggleAll(){el('all').classList.toggle('hidden');
