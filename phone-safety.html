<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機安全急救站</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193047;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:19px}main{max-width:850px;margin:auto;padding:18px 14px 70px}header{background:linear-gradient(115deg,#13506b,#20736b);color:white;border-radius:20px;padding:23px}h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}h2{font-size:25px}p{line-height:1.65}.sub{margin:0;font-size:17px}.panel{background:white;padding:22px;border-radius:17px;margin:16px 0;box-shadow:0 3px 15px #21344913}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.btn,button,select,input{font:inherit}button{cursor:pointer}.btn{background:#175f73;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:700;min-height:48px}.btn.alt{background:#e3f0f6;color:#1d4b64}.btn:disabled{opacity:.4}.option{display:block;text-align:left;width:100%;margin:9px 0;background:white;border:2px solid #c8dbe6;border-radius:13px;padding:15px;font-size:19px}.option.sel{border-color:#0b816b;background:#e4f8ee}label{display:block;font-weight:700;margin:16px 0 6px}input,select{padding:12px;border-radius:10px;border:1px solid #a6bfcb;max-width:100%;width:100%;background:#fff}.summary{background:#e7f5ef;border:1px solid #b4dac8;border-radius:12px;padding:17px;white-space:pre-wrap;line-height:1.7}.warning{background:#fff6df;border-left:5px solid #f0ba47;padding:13px;border-radius:6px;line-height:1.6}.muted{color:#526879;font-size:16px}.badge{background:#dbf1ea;color:#17614f;display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hidden{display:none}.divider{border-top:1px solid #d9e6ec;margin:17px 0}footer{font-size:15px;color:#5d7180;line-height:1.7;padding:12px}a{color:#126c86;word-break:break-all}@media print{button{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ccc}}</style></head><body><main><header><h1>手機安全急救站</h1><p class="sub">手機遺失、緊急資訊與安全情境問答。</p></header><div class="warning" style="margin-top:15px">教學模擬網站｜不連線至商家／醫院、不會真正預約、扣款或送出個資。所有姓名與資料請使用虛構內容。</div><section class="panel"><h2>① 選擇情境</h2><div class="grid" id="scenes"></div></section><section class="panel"><h2 id="sceneTitle">先選情境</h2><p id="sceneDesc">這裡會出現要處理的問題。</p><div id="answers"></div><div id="feedback" class="summary hidden"></div><div class="row"><button class="btn alt" onclick="resetScene()">重新作答</button></div></section><section class="panel"><h2>② 真正設定手機時</h2><p>請由老師示範 iPhone「設定 → SOS緊急服務／醫療卡」與 Android「設定 → 安全與緊急狀況」（名稱可能因品牌版本不同），並操作「尋找」裝置功能。</p><div class="warning">課堂禁止實際測試緊急求救電話、警報功能或無故啟動緊急服務。也不要公開真實醫療資料及帳號密碼。</div></section><footer>55歲以上智慧手機生活班｜純離線教學練習 • 可將此HTML放到GitHub Pages供學員掃碼開啟。</footer></main><script>function el(id){return document.getElementById(id)}function money(n){return 'NT$'+Number(n).toLocaleString('zh-TW')}function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function display(id,show){el(id).classList.toggle('hidden',!show)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('已複製')).catch(()=>prompt('長按複製',text))}else prompt('長按複製',text)};const cases=[{title:'手機不見了',desc:'你在咖啡店找不到自己的手機，第一步如何處理？',opts:['用尋找裝置服務查看可能位置，並確認帳號安全','把帳號密碼貼到社群群組求救','等一星期再處理'],key:0,ex:'可用Apple「尋找」或Google尋找裝置服務；必要時啟用遺失模式、變更密碼與聯絡相關單位。'},{title:'收到陌生人拾獲手機訊息',desc:'有人稱撿到手機，要求先提供驗證碼，該怎麼做？',opts:['立即傳送驗證碼','不要提供驗證碼，透過安全管道安排確認','把身分證照片傳給對方'],key:1,ex:'驗證碼可能被用來登入或接管帳號，不應提供。'},{title:'長輩緊急聯絡資料',desc:'想讓救援人員在必要時找到緊急聯絡人，應事先做什麼？',opts:['將個資公開在社群','只告訴陌生網友','設定手機緊急聯絡人及必要醫療資訊'],key:2,ex:'可預先設定手機提供的緊急資訊功能，並與本人及家人確認內容。'},{title:'緊急求救功能',desc:'上課練習時，是否應按下真正的SOS求救？',opts:['可以，當作測試','不要，改看教師示範畫面與操作說明','直接撥打119詢問手機設定'],key:1,ex:'不應為練習而啟動緊急求救；請依手機說明查看設定。'}];let idx=-1;el('scenes').innerHTML=cases.map((c,i)=>'<button class="option" onclick="pick('+i+')">'+(i+1)+'. '+c.title+'</button>').join('');function pick(i){idx=i;el('sceneTitle').textContent=cases[i].title;el('sceneDesc').textContent=cases[i].desc;display('feedback',false);el('answers').innerHTML=cases[i].opts.map((a,j)=>'<button class="option" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+a+'</button>').join('')}function answer(j){el('feedback').textContent=(j===cases[idx].key?'✅ 答對了！':'❌ 再注意安全觀念。')+'\n正確做法：'+cases[idx].opts[cases[idx].key]+'\n原因：'+cases[idx].ex;display('feedback',true)}function resetScene(){if(idx>=0)pick(idx)}</script></body></html>
