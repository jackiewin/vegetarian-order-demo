<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>醫院預約掛號模擬</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193047;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:19px}main{max-width:850px;margin:auto;padding:18px 14px 70px}header{background:linear-gradient(115deg,#13506b,#20736b);color:white;border-radius:20px;padding:23px}h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}h2{font-size:25px}p{line-height:1.65}.sub{margin:0;font-size:17px}.panel{background:white;padding:22px;border-radius:17px;margin:16px 0;box-shadow:0 3px 15px #21344913}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.btn,button,select,input{font:inherit}button{cursor:pointer}.btn{background:#175f73;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:700;min-height:48px}.btn.alt{background:#e3f0f6;color:#1d4b64}.btn:disabled{opacity:.4}.option{display:block;text-align:left;width:100%;margin:9px 0;background:white;border:2px solid #c8dbe6;border-radius:13px;padding:15px;font-size:19px}.option.sel{border-color:#0b816b;background:#e4f8ee}label{display:block;font-weight:700;margin:16px 0 6px}input,select{padding:12px;border-radius:10px;border:1px solid #a6bfcb;max-width:100%;width:100%;background:#fff}.summary{background:#e7f5ef;border:1px solid #b4dac8;border-radius:12px;padding:17px;white-space:pre-wrap;line-height:1.7}.warning{background:#fff6df;border-left:5px solid #f0ba47;padding:13px;border-radius:6px;line-height:1.6}.muted{color:#526879;font-size:16px}.badge{background:#dbf1ea;color:#17614f;display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hidden{display:none}.divider{border-top:1px solid #d9e6ec;margin:17px 0}footer{font-size:15px;color:#5d7180;line-height:1.7;padding:12px}a{color:#126c86;word-break:break-all}@media print{button{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ccc}}</style></head><body><main><header><h1>醫院預約掛號模擬</h1><p class="sub">練習選科別、醫師、時段、查看掛號結果與取消。</p></header><div class="warning" style="margin-top:15px">教學模擬網站｜不連線至商家／醫院、不會真正預約、扣款或送出個資。所有姓名與資料請使用虛構內容。</div><section class="panel"><h2>① 選擇看診資訊</h2><label>科別</label><select id="dept" onchange="setDoctors()"><option>家醫科</option><option>眼科</option><option>骨科</option><option>心臟內科</option></select><label>醫師</label><select id="doctor"></select><label>日期（模擬）</label><select id="date"><option>星期一</option><option>星期二</option><option>星期五</option></select><label>時段</label><select id="session"><option>上午診</option><option>下午診</option><option>夜間診</option></select><label>暱稱（請勿填真名）</label><input id="alias" placeholder="例如：樂齡學員" value="樂齡學員"><div class="row"><button class="btn" onclick="book()">模擬掛號</button><button class="btn alt" onclick="cancel()">取消模擬掛號</button></div><div id="result" class="summary hidden" style="margin-top:14px"></div></section><section class="panel"><h2>② 課堂討論</h2><p>掛號完成後，應確認哪些事情？</p><p>✔ 科別與醫師 ✔ 日期時段 ✔ 掛號號碼 ✔ 報到時間 ✔ 取消規則</p></section><footer>55歲以上智慧手機生活班｜純離線教學練習 • 可將此HTML放到GitHub Pages供學員掃碼開啟。</footer></main><script>function el(id){return document.getElementById(id)}function money(n){return 'NT$'+Number(n).toLocaleString('zh-TW')}function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function display(id,show){el(id).classList.toggle('hidden',!show)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('已複製')).catch(()=>prompt('長按複製',text))}else prompt('長按複製',text)};const doctors={'家醫科':['林安心醫師','陳健康醫師'],'眼科':['王明亮醫師','周護眼醫師'],'骨科':['張健步醫師','李平安醫師'],'心臟內科':['郭關懷醫師','蔡安心醫師']};let booking=null;function setDoctors(){el('doctor').innerHTML=doctors[el('dept').value].map(n=>'<option>'+n+'</option>').join('')}function book(){let a=el('alias').value.trim()||'學員';booking={a,dept:el('dept').value,doctor:el('doctor').value,date:el('date').value,s:el('session').value};el('result').textContent='✅ 模擬掛號成功\n暱稱：'+a+'\n科別：'+booking.dept+'\n醫師：'+booking.doctor+'\n日期：'+booking.date+'\n時段：'+booking.s+'\n模擬掛號號碼：018\n（非真實醫院掛號）';display('result',true)}function cancel(){el('result').textContent=booking?'已取消本次模擬掛號，沒有通知任何醫院。':'目前沒有模擬掛號可以取消。';booking=null;display('result',true)}setDoctors();</script></body></html>
