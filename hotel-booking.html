<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅館訂房模擬教室</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193047;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:19px}main{max-width:850px;margin:auto;padding:18px 14px 70px}header{background:linear-gradient(115deg,#13506b,#20736b);color:white;border-radius:20px;padding:23px}h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}h2{font-size:25px}p{line-height:1.65}.sub{margin:0;font-size:17px}.panel{background:white;padding:22px;border-radius:17px;margin:16px 0;box-shadow:0 3px 15px #21344913}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.btn,button,select,input{font:inherit}button{cursor:pointer}.btn{background:#175f73;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:700;min-height:48px}.btn.alt{background:#e3f0f6;color:#1d4b64}.btn:disabled{opacity:.4}.option{display:block;text-align:left;width:100%;margin:9px 0;background:white;border:2px solid #c8dbe6;border-radius:13px;padding:15px;font-size:19px}.option.sel{border-color:#0b816b;background:#e4f8ee}label{display:block;font-weight:700;margin:16px 0 6px}input,select{padding:12px;border-radius:10px;border:1px solid #a6bfcb;max-width:100%;width:100%;background:#fff}.summary{background:#e7f5ef;border:1px solid #b4dac8;border-radius:12px;padding:17px;white-space:pre-wrap;line-height:1.7}.warning{background:#fff6df;border-left:5px solid #f0ba47;padding:13px;border-radius:6px;line-height:1.6}.muted{color:#526879;font-size:16px}.badge{background:#dbf1ea;color:#17614f;display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hidden{display:none}.divider{border-top:1px solid #d9e6ec;margin:17px 0}footer{font-size:15px;color:#5d7180;line-height:1.7;padding:12px}a{color:#126c86;word-break:break-all}@media print{button{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ccc}}</style></head><body><main><header><h1>旅館訂房模擬教室</h1><p class="sub">練習比較房型、住宿晚數、總價及取消政策。</p></header><div class="warning" style="margin-top:15px">教學模擬網站｜不連線至商家／醫院、不會真正預約、扣款或送出個資。所有姓名與資料請使用虛構內容。</div><section class="panel"><h2>① 模擬訂房</h2><label>地點</label><select id="place"><option>宜蘭</option><option>台南</option><option>花蓮</option></select><label>房型</label><select id="room"><option value="2200">雙人標準房 NT$2,200／晚</option><option value="3000">雙人景觀房 NT$3,000／晚</option><option value="3900">四人家庭房 NT$3,900／晚</option></select><label>入住日期（模擬）</label><select id="date"><option>下週星期五</option><option>下週星期六</option><option>下個月第一個星期五</option></select><label>住宿晚數</label><select id="nights"><option value="1">1晚</option><option value="2">2晚</option><option value="3">3晚</option></select><label>退訂方案</label><select id="policy"><option value="flex">可於入住前3天免費取消（模擬）</option><option value="strict">不可退款方案（模擬）</option></select><button class="btn" style="margin-top:18px" onclick="bookHotel()">查看訂房明細</button><div id="result" class="summary hidden" style="margin-top:15px"></div></section><section class="panel"><h2>② 比較訂房條件</h2><p>注意：實際平台可能有稅費、早餐、停車、入住人數、無障礙設施等限制；不能只看房價。</p><div class="warning">此站價格、日期與退訂規則均是教材示例，不代表任何真實飯店。</div></section><footer>55歲以上智慧手機生活班｜純離線教學練習 • 可將此HTML放到GitHub Pages供學員掃碼開啟。</footer></main><script>function el(id){return document.getElementById(id)}function money(n){return 'NT$'+Number(n).toLocaleString('zh-TW')}function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function display(id,show){el(id).classList.toggle('hidden',!show)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('已複製')).catch(()=>prompt('長按複製',text))}else prompt('長按複製',text)};function bookHotel(){const nights=Number(el('nights').value),rate=Number(el('room').value),isflex=el('policy').value==='flex',service=Math.round(rate*nights*.1);el('result').textContent='🏨 模擬訂房明細\n地點：'+el('place').value+'\n房型：'+el('room').selectedOptions[0].text+'\n入住：'+el('date').value+'\n晚數：'+nights+'\n房價小計：'+money(rate*nights)+'\n模擬服務費（10%）：'+money(service)+'\n總計：'+money(rate*nights+service)+'\n取消條款：'+(isflex?'入住前3天免費取消':'不可退款')+'\n\n本系統沒有實際訂房、收費或存取個資。';display('result',true)}</script></body></html>
