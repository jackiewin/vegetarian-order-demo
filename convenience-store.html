<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超商生活服務模擬</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193047;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:19px}main{max-width:850px;margin:auto;padding:18px 14px 70px}header{background:linear-gradient(115deg,#13506b,#20736b);color:white;border-radius:20px;padding:23px}h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}h2{font-size:25px}p{line-height:1.65}.sub{margin:0;font-size:17px}.panel{background:white;padding:22px;border-radius:17px;margin:16px 0;box-shadow:0 3px 15px #21344913}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.btn,button,select,input{font:inherit}button{cursor:pointer}.btn{background:#175f73;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:700;min-height:48px}.btn.alt{background:#e3f0f6;color:#1d4b64}.btn:disabled{opacity:.4}.option{display:block;text-align:left;width:100%;margin:9px 0;background:white;border:2px solid #c8dbe6;border-radius:13px;padding:15px;font-size:19px}.option.sel{border-color:#0b816b;background:#e4f8ee}label{display:block;font-weight:700;margin:16px 0 6px}input,select{padding:12px;border-radius:10px;border:1px solid #a6bfcb;max-width:100%;width:100%;background:#fff}.summary{background:#e7f5ef;border:1px solid #b4dac8;border-radius:12px;padding:17px;white-space:pre-wrap;line-height:1.7}.warning{background:#fff6df;border-left:5px solid #f0ba47;padding:13px;border-radius:6px;line-height:1.6}.muted{color:#526879;font-size:16px}.badge{background:#dbf1ea;color:#17614f;display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hidden{display:none}.divider{border-top:1px solid #d9e6ec;margin:17px 0}footer{font-size:15px;color:#5d7180;line-height:1.7;padding:12px}a{color:#126c86;word-break:break-all}@media print{button{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ccc}}</style></head><body><main><header><h1>超商生活服務模擬</h1><p class="sub">四種情境：取貨、列印、繳費與購買票券。</p></header><div class="warning" style="margin-top:15px">教學模擬網站｜不連線至商家／醫院、不會真正預約、扣款或送出個資。所有姓名與資料請使用虛構內容。</div><section class="panel"><h2>① 選擇超商服務</h2><div class="grid" id="services"></div></section><section class="panel"><h2>② 依序練習操作</h2><h2 id="serviceTitle">請先選服務</h2><p id="instruction" class="muted">點選上方服務開始。</p><div id="steps" class="grid"></div><div id="result" class="summary hidden"></div></section><footer>55歲以上智慧手機生活班｜純離線教學練習 • 可將此HTML放到GitHub Pages供學員掃碼開啟。</footer></main><script>function el(id){return document.getElementById(id)}function money(n){return 'NT$'+Number(n).toLocaleString('zh-TW')}function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function display(id,show){el(id).classList.toggle('hidden',!show)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('已複製')).catch(()=>prompt('長按複製',text))}else prompt('長按複製',text)};const services=[{name:'包裹取貨',steps:['確認取貨門市','找到取貨通知','核對取件資料','領取包裹並留意詐騙']},{name:'列印文件',steps:['確認檔案格式','取得列印代碼或其他傳檔方式','到機台輸入資訊','核對頁數與費用']},{name:'繳交帳單',steps:['核對帳單來源與金額','確認條碼及繳費期限','選擇合適繳費管道','保存繳費證明']},{name:'購買票券',steps:['選擇活動與日期','核對張數與價格','閱讀退換票規定','確認付款與取票方式']}];let active=-1,progress=new Set();el('services').innerHTML=services.map((s,i)=>'<button class="option" onclick="choose('+i+')">'+(i+1)+'. '+s.name+'</button>').join('');function choose(i){active=i;progress.clear();el('serviceTitle').textContent=services[i].name;el('instruction').textContent='依序點選每一步，完成模擬流程。';display('result',false);drawSteps()}function drawSteps(){el('steps').innerHTML=services[active].steps.map((s,i)=>'<button class="option '+(progress.has(i)?'sel':'')+'" onclick="advance('+i+')">'+(progress.has(i)?'✓ ':'□ ')+(i+1)+'. '+s+'</button>').join('')}function advance(i){if(i>0&&!progress.has(i-1)){alert('請先完成上一個步驟');return}progress.add(i);drawSteps();if(progress.size===4){el('result').textContent='🎉 完成「'+services[active].name+'」模擬操作！\n提醒：不同超商與門市提供的服務、付款方式及操作畫面可能不同。';display('result',true)}}</script></body></html>
