<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>手機生活知識20題互動測驗</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f8f7;color:#193a35}header{background:linear-gradient(120deg,#115d52,#37897c);color:white;padding:34px 18px}header .wrap,main{max-width:960px;margin:auto}h1{font-size:clamp(28px,5vw,42px);margin:0 0 10px}p{line-height:1.75}main{padding:20px 15px 65px}.intro{font-size:18px}.card{background:white;border:1px solid #dbe6df;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 7px 22px #113c2910}h2{margin:0 0 8px;font-size:26px}.muted{color:#59736c}.pill{display:inline-block;background:#e3f2ea;border-radius:50px;padding:6px 12px;font-weight:700;color:#176854;font-size:15px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.btn,button{border:0;border-radius:11px;background:#136858;color:white;padding:12px 16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;min-height:46px}.btn.secondary,button.secondary{background:#e6f2ee;color:#165447}.qr{width:135px;max-width:100%;background:white;border:1px solid #ddd;padding:5px;border-radius:9px}.layout{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.quiz{background:#f3f8f6;padding:14px;border-radius:11px;margin-top:13px}.answer{color:#135c43;font-weight:750;background:#e5f5eb;padding:11px;border-radius:8px;margin-top:9px}.hidden{display:none}.note{background:#fff6e8;border-left:5px solid #e3a332;padding:15px;border-radius:10px;font-size:16px}.topbar{display:flex;gap:10px;flex-wrap:wrap}.topbar button{background:#e2eee9;color:#135646}a{color:#13675e;word-break:break-all}a.btn{display:inline-flex;align-items:center;text-decoration:none;color:white}.fine{font-size:14px;color:#60776d}@media(max-width:550px){.layout{grid-template-columns:1fr}.qr{width:120px}.card{padding:18px}} .choices{display:grid;gap:9px;margin:16px 0}.choice{text-align:left;background:#f0f6f3;color:#204a40;border:2px solid #d7e5df;font-weight:550}.choice.selected{background:#d9ece3;border-color:#18836b}.qnum{font-size:17px;font-weight:700;color:#4d7569}.result{background:#e6f6ec;border-radius:12px;padding:14px;font-size:18px}.result.wrong{background:#fff1e9}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.controls button{flex:1}.progress{height:10px;background:#d9eae3;border-radius:20px;overflow:hidden}.fill{height:100%;background:#42b597;transition:width .2s}.feedback{margin-top:12px}.summary{font-size:20px;font-weight:750}</style></head><body><header><div class="wrap"><h1>📱 手機生活知識大挑戰</h1><p class="intro">20題生活情境｜先答題、按「答案」才公布解答｜適合55歲以上學長姐</p></div></header><main><div class="note">純教學練習：沒有連線登入、沒有扣款。題目包括掃碼點餐、餐廳訂位、Uber、外送、手機安全、健康與景點導覽。</div><div class="topbar" style="margin-top:16px"><button id="one">逐題模式</button><button id="all">20題總覽</button><button id="reset">重新作答</button></div><section class="card"><div class="progress"><div class="fill" id="fill"></div></div><p id="stat" class="muted"></p></section><div id="list"></div><section class="card"><div class="summary" id="summary">請先作答，按「答案」查看解析。</div></section></main><script>const data=[["收到餐廳的QR Code，正確的第一步是？", ["直接輸入銀行密碼", "確認QR Code與網址是否屬於店家", "下載陌生APP", "把手機交給陌生人"], 1, "先確認掃碼來源與網址。"], ["手機訂位時，最需要確認哪一項？", ["手機桌布", "人數、日期與時間", "螢幕亮度", "手機鈴聲"], 1, "訂位前核對人數、日期、時間與餐廳名稱。"], ["在餐廳掃碼點餐，送出前應先做什麼？", ["關閉網路", "確認桌號、餐點與總金額", "刪除訂單", "把驗證碼給店員"], 1, "確認桌號、口味、數量、金額，避免下錯單。"], ["點餐選擇「自取」通常代表什麼？", ["一定送到家", "自己到指定地點領餐", "自動取消", "不需確認時間"], 1, "自取需要確認領餐門市及時間。"], ["使用Uber叫車，上車前最應核對哪項資訊？", ["車內音樂", "車牌、車型與駕駛資訊", "乘客穿著", "司機手機品牌"], 1, "以APP資訊核對正確車輛與駕駛。"], ["Uber Eats顯示運費以外的服務費，應如何做？", ["只看餐點價格", "確認最後結帳總額", "不理會", "直接付款"], 1, "結帳前應查看全部費用與優惠條件。"], ["叫車或外送地址輸入錯誤，較好的做法是？", ["等到最後再說", "儘快在APP查看修改或客服選項", "把帳號密碼給司機", "重新買手機"], 1, "修改可能有限制，應及時用官方管道處理。"], ["線上訂位無法前往時，應該？", ["完全不處理", "查看取消規則並儘早取消", "刪除APP", "改用別人的姓名"], 1, "提前取消可避免影響餐廳及可能的費用。"], ["餐飲會員優惠券，應留意什麼？", ["只有顏色", "期限、門市及使用條件", "手機型號", "朋友的照片"], 1, "優惠券常有限制條件。"], ["收到「中獎，先繳手續費」訊息，怎麼辦？", ["立即付款", "自行用官方管道查證", "提供驗證碼", "轉傳所有群組"], 1, "先付款才能領獎是常見詐騙警訊。"], ["手機收到6位數驗證碼，陌生客服索取，應如何處理？", ["直接傳送", "不提供，改從官方管道確認", "截圖給全班", "公布在FB"], 1, "驗證碼不得交給其他人。"], ["Google Maps的「分享地點」與「即時位置」有何不同？", ["完全相同", "前者傳固定地點，後者可能持續分享位置", "兩者都會自動付款", "兩者都是訂位"], 1, "即時位置分享涉及隱私，完成後要檢查是否關閉。"], ["查看陌生網址時，哪個做法較安全？", ["只看網站圖片", "仔細核對網域並從官方入口進入", "看有沒有紅色字", "看轉傳數"], 1, "官方來源與正確網域比外觀更重要。"], ["Google Lens辨識植物後，應該？", ["一律當作正確", "再比對可信資料與植物特徵", "馬上食用", "直接當藥材"], 1, "影像辨識可能出錯，不可用來保證可食性。"], ["手機翻譯外文菜單時，若有食物過敏，應如何做？", ["完全依賴機器翻譯", "再向店員確認成分", "不看菜單", "只看照片"], 1, "翻譯可能不準確，過敏成分應直接確認。"], ["健保快易通的健康資料，適合怎樣使用？", ["公開貼群組", "自行查詢並與醫護人員討論", "隨便修改", "將帳密借給同學"], 1, "健康資料涉及個資，也不能自行以數值診斷。"], ["發票載具條碼主要用途是？", ["自動叫車", "儲存雲端發票", "啟動錄影", "支付所有款項"], 1, "載具條碼與付款碼是不同用途。"], ["掃描紙本公告成PDF後，想分享給同學，應先？", ["確認檔案內容及有無個資", "立刻公開所有人", "先刪除檔案", "提供手機密碼"], 0, "分享前確認內容、權限及個人資料。"], ["AI回答旅遊班次時間，最好的做法是？", ["直接認定正確", "再查看交通業者官方最新資訊", "只相信AI", "不要查日期"], 1, "即時班次需要查詢官方最新資料。"], ["景區QR Code導覽通常能做什麼？", ["保證免費搭車", "開啟景點介紹、語音或導覽服務", "直接取得他人帳密", "自動扣款"], 1, "不同景區提供的內容不同，應先確認官方入口。"]];let current=0,mode='one',answers={},opened={};const list=document.getElementById('list');function show(){list.innerHTML='';let nums=mode==='all'?data.map((_,i)=>i):[current];nums.forEach(i=>{let [q,opts,correct,explain]=data[i];let card=document.createElement('article');card.className='card';let h=document.createElement('div');h.className='qnum';h.textContent=`第 ${i+1} 題／20`;card.append(h);let title=document.createElement('h2');title.style.marginTop='12px';title.textContent=q;card.append(title);let choices=document.createElement('div');choices.className='choices';opts.forEach((o,j)=>{let b=document.createElement('button');b.className='choice'+(answers[i]===j?' selected':'');b.textContent=['A','B','C','D'][j]+'．'+o;b.onclick=()=>{answers[i]=j;show()};choices.appendChild(b)});card.append(choices);let btn=document.createElement('button');btn.textContent=opened[i]?'收起答案':'答案';btn.onclick=()=>{opened[i]=!opened[i];show()};card.append(btn);if(opened[i]){let r=document.createElement('div');r.className='result feedback'+(answers[i]!==undefined&&answers[i]!==correct?' wrong':'');let headline=document.createElement('b');headline.textContent='✅ 正確答案：'+['A','B','C','D'][correct]+'．'+opts[correct];r.append(headline);let p=document.createElement('p');p.textContent=explain;r.append(p);if(answers[i]!==undefined){let judge=document.createElement('b');judge.textContent=answers[i]===correct?'🎉 您答對了！':'💡 這題再記住正確做法！';r.append(judge)}card.append(r)}if(mode==='one'){let nav=document.createElement('div');nav.className='controls';let back=document.createElement('button');back.className='secondary';back.textContent='← 上一題';back.disabled=i===0;back.onclick=()=>{current--;show();scrollTo(0,0)};let next=document.createElement('button');next.textContent=i===19?'回到第1題':'下一題 →';next.onclick=()=>{current=(current+1)%20;show();scrollTo(0,0)};nav.append(back,next);card.append(nav)}list.append(card)});let count=Object.keys(answers).length,sc=data.filter((q,i)=>answers[i]===q[2]).length;document.getElementById('stat').textContent='已作答 '+count+' / 20 題，已答對 '+sc+' 題';document.getElementById('fill').style.width=(count*5)+'%';document.getElementById('summary').textContent=count===20?'目前成績：'+sc*5+'分／100分。可以按答案逐題複習。':'已回答 '+count+' 題，繼續挑戰！'}document.getElementById('one').onclick=()=>{mode='one';show()};document.getElementById('all').onclick=()=>{mode='all';show()};document.getElementById('reset').onclick=()=>{if(confirm('確定清除所有作答紀錄？')){answers={};opened={};current=0;show()}};show();</script></body></html>
