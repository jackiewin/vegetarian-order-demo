<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電影訂票模擬教室</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193047;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:19px}main{max-width:850px;margin:auto;padding:18px 14px 70px}header{background:linear-gradient(115deg,#13506b,#20736b);color:white;border-radius:20px;padding:23px}h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}h2{font-size:25px}p{line-height:1.65}.sub{margin:0;font-size:17px}.panel{background:white;padding:22px;border-radius:17px;margin:16px 0;box-shadow:0 3px 15px #21344913}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.btn,button,select,input{font:inherit}button{cursor:pointer}.btn{background:#175f73;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:700;min-height:48px}.btn.alt{background:#e3f0f6;color:#1d4b64}.btn:disabled{opacity:.4}.option{display:block;text-align:left;width:100%;margin:9px 0;background:white;border:2px solid #c8dbe6;border-radius:13px;padding:15px;font-size:19px}.option.sel{border-color:#0b816b;background:#e4f8ee}label{display:block;font-weight:700;margin:16px 0 6px}input,select{padding:12px;border-radius:10px;border:1px solid #a6bfcb;max-width:100%;width:100%;background:#fff}.summary{background:#e7f5ef;border:1px solid #b4dac8;border-radius:12px;padding:17px;white-space:pre-wrap;line-height:1.7}.warning{background:#fff6df;border-left:5px solid #f0ba47;padding:13px;border-radius:6px;line-height:1.6}.muted{color:#526879;font-size:16px}.badge{background:#dbf1ea;color:#17614f;display:inline-block;padding:5px 11px;border-radius:999px;font-size:15px}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hidden{display:none}.divider{border-top:1px solid #d9e6ec;margin:17px 0}footer{font-size:15px;color:#5d7180;line-height:1.7;padding:12px}a{color:#126c86;word-break:break-all}@media print{button{display:none}body{background:white}.panel{box-shadow:none;border:1px solid #ccc}}</style></head><body><main><header><h1>電影訂票模擬教室</h1><p class="sub">練習選電影、選日期場次、選座位及核對票價。</p></header><div class="warning" style="margin-top:15px">教學模擬網站｜不連線至商家／醫院、不會真正預約、扣款或送出個資。所有姓名與資料請使用虛構內容。</div><section class="panel"><h2>① 選電影與場次</h2><label>電影</label><select id="movie"><option value="人生好風景">人生好風景（劇情）</option><option value="環島大旅行">環島大旅行（喜劇）</option><option value="森林的聲音">森林的聲音（紀錄）</option></select><label>日期（模擬）</label><select id="date"><option>星期六</option><option>星期日</option><option>下星期三</option></select><label>場次</label><select id="time"><option>10:30</option><option>14:00</option><option>18:30</option></select></section><section class="panel"><h2>② 選擇座位</h2><p class="muted">點選座位，可取消選取。已售座位不能選。</p><div class="grid" id="seats"></div><p>一般票每張 NT$280（純模擬價格）</p><button class="btn" onclick="confirmMovie()">確認模擬訂票</button><div id="result" class="summary hidden" style="margin-top:14px"></div></section><footer>55歲以上智慧手機生活班｜純離線教學練習 • 可將此HTML放到GitHub Pages供學員掃碼開啟。</footer></main><script>function el(id){return document.getElementById(id)}function money(n){return 'NT$'+Number(n).toLocaleString('zh-TW')}function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function display(id,show){el(id).classList.toggle('hidden',!show)}function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('已複製')).catch(()=>prompt('長按複製',text))}else prompt('長按複製',text)};const chosen=new Set(),blocked=new Set(['A2','B3','C1']);function drawSeats(){el('seats').innerHTML='';for(const row of ['A','B','C'])for(let i=1;i<=4;i++){let s=row+i,b=document.createElement('button');b.className='option'+(chosen.has(s)?' sel':'');b.textContent=s+(blocked.has(s)?'（已售）':'');b.disabled=blocked.has(s);b.onclick=()=>{chosen.has(s)?chosen.delete(s):chosen.add(s);drawSeats()};el('seats').append(b)}}function confirmMovie(){if(!chosen.size){alert('請先選至少一個座位');return}const text='🎬 模擬訂票完成\n電影：'+el('movie').value+'\n日期：'+el('date').value+'\n時間：'+el('time').value+'\n座位：'+[...chosen].sort().join('、')+'\n合計：'+money(chosen.size*280)+'\n（沒有真正訂票或扣款）';el('result').textContent=text;display('result',true)}drawSeats();</script></body></html>
